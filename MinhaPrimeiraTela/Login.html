<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SENAI</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div id="login">
        <!-- A caixa que contém os elementos do HTML -->
        <div class="caixa">
            <!-- Logo do SENAI -->
            <img src="./img/LogoSENAI.png" alt="Logo do SENAI">

            <!-- Tag de Título -->
            <h1>Login</h1>

            <!-- Tags de Formulário -->
            <div class="Login">
                <input type="email" placeholder="Login">
            </div>

            <div class="Senha">
                <input type="password" placeholder="Senha">
            </div>

            <!-- Botão de Logar -->
            <div class="entrar">
                <input type="submit" value="Acessar">
                <p>
                    Ainda nao tem conta?
                    <a>Clique Aqui</a>
                </p>
            </div>

            <!-- Recuperação de senha com Âncora -->
            <div class="recuperacao-senha">
                <p>
                    <span>Esqueceu sua senha?</span>
                    <a>Recupere Aqui</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
